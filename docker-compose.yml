version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mari-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mari_admin
      POSTGRES_PASSWORD: mari_dev_password_2025
      POSTGRES_DB: mari_erp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mari_admin -d mari_erp_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mari-erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mari-erp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: mari_minio_admin
      MINIO_ROOT_PASSWORD: mari_minio_password_2025
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    name: mari-erp-network
